name: CI Quality Gate

on:
  push:
    branches: [main, develop, "refinement/*", "feature/*", "feat/*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-verify:
    name: Frontend — Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Linting check
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Automated test suite
        run: npm test

      - name: Next.js production build check
        run: npm run build
        env:
          NODE_ENV: production

  backend-verify:
    name: Backend (NestJS) — Prisma, Build, Unit & E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/niventra_ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint NestJS backend
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Build NestJS backend
        run: npm run build

      - name: Run Jest unit tests
        run: npm test

      - name: Run Supertest E2E tests
        run: npm run test:e2e
